syntax = "proto3";
package lunhui;
option csharp_namespace = "Lunhui.Protocol";

// Java: com.iohao.mmo.adventure.proto.AdventureRequest
//
message AdventureRequest {
 string id=1;
 string dungeonId=2;
 string explorationId=3;
 string mapId=4;
 string riftId=5;
 string realmId=6;
 string trialId=7;
 int32 difficulty=8;
 int32 stageId=9;
 int32 stars=10;
 int32 wave=11;
 int32 kills=12;
 int32 damage=13;
 bool victory=14;
 string location=15;
 string playerName=16;
}

// Java: com.iohao.mmo.adventure.proto.DungeonMessage
//
message DungeonMessage {
 string id=1;
 int64 userId=2;
 string dungeonId=3;
 string dungeonName=4;
 string type=5;
 int32 currentStage=6;
 int32 maxStage=7;
 string status=8;
 int64 startTime=9;
 int64 completeTime=10;
 int32 difficulty=11;
repeated StageProgressMessage stageProgress=12;
 RewardMessage reward=13;
 bool firstClear=14;
 int32 clearCount=15;
 int64 bestTime=16;
}
//
message StageProgressMessage {
 int32 stageId=1;
 string stageName=2;
 bool completed=3;
 int32 stars=4;
 int64 clearTime=5;
 int32 enemiesKilled=6;
 int32 deaths=7;
}
//
message RewardMessage {
 int32 exp=1;
 int32 gold=2;
repeated ItemDropMessage items=3;
 string title=4;
 string achievement=5;
}
//
message ItemDropMessage {
 string itemId=1;
 string itemName=2;
 string rarity=3;
 int32 quantity=4;
}

